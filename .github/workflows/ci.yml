name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    name: test (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Los fixtures de test se generan con pyzipper y el `zip` del sistema
      # (preinstalado en los runners de ubuntu).
      - name: Install pyzipper
        run: pip install pyzipper

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  native:
    runs-on: ubuntu-latest
    name: addon nativo (C++ N-API)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install pyzipper
      - run: npm ci
      # Compila el addon C++ (Biham-Kocher). node-gyp usa el toolchain
      # preinstalado en los runners de ubuntu (gcc/make/python).
      - name: Build native addon
        run: npm run build:native
      # Con el addon compilado, `lib/native` reporta available=true y la suite
      # ejercita el e2e nativo (test/native.test.js) además del motor JS.
      - name: Test (incluye addon nativo)
        run: npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install pyzipper
      - run: npm ci
      - name: Coverage (c8)
        run: npm run coverage
        env:
          GANZUA_SLOW: '1' # ejercita también el ataque nativo Biham-Kocher e2e
